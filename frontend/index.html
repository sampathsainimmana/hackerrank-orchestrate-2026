<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy or Wait?</title><style>body{margin:0;background:#f5f8f7;color:#10231e;font:16px system-ui,sans-serif}main{max-width:780px;margin:7vh auto;padding:32px}.badge{font-weight:700;letter-spacing:.08em}h1{font-size:48px;margin:8px 0}p{color:#52625d;line-height:1.5}.card{background:#fff;border-radius:20px;padding:26px;margin-top:25px}select,button{font:inherit;padding:14px;border-radius:10px;border:1px solid #d6e0db}select{width:65%}button{background:#087f5b;color:#fff;border:0;font-weight:700;margin-left:8px}.result{display:none;margin-top:24px}.status{font-size:26px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.metric{background:#eff8f4;border-radius:12px;padding:14px}.metric span{display:block;color:#687872;font-size:13px}@media(max-width:600px){main{padding:18px}h1{font-size:38px}select{width:100%}button{margin:10px 0 0;width:100%}}</style><body><main><div class="badge">HACKERRANK ORCHESTRATE 2026</div><h1>Buy or Wait?</h1><p>Explore a deterministic financial safety decision for a purchase request.</p><div class="card"><select id="request"></select><button onclick="checkDecision()">Evaluate</button><div id="result" class="result"></div></div></main><script>async function loadRequests(){const r=await fetch("/api/requests");const data=await r.json();const s=document.getElementById("request");data.forEach(x=>{const o=document.createElement("option");o.value=x.request_id;o.textContent=x.request_id;s.appendChild(o)})}async function checkDecision(){const id=document.getElementById("request").value;const r=await fetch("/api/decision/"+encodeURIComponent(id));const d=await r.json();const el=document.getElementById("result");el.style.display="block";el.innerHTML="<div class='status'>"+d.affordability_status+"</div><div class='grid'><div class='metric'><span>Safe today</span>"+d.amount_safe_to_pay+"</div><div class='metric'><span>Method</span>"+d.recommended_payment_method+"</div><div class='metric'><span>Full payment date</span>"+(d.earliest_date_for_full_payment||"—")+"</div><div class='metric'><span>Plan</span>"+(d.payment_plan||"—")+"</div></div><p>"+d.decision_explanation+"</p>"}loadRequests()</script></body></html>
